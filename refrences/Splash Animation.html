<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_26 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_26" style="display:block;"><svg viewbox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap');
    
    .brand-text { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      font-weight: 700; 
      fill: #F5F5F2; 
      font-size: 80px; 
      text-anchor: middle;
      letter-spacing: -0.02em;
    }
    
    .dot { fill: #A8ADB5; }
    
    /* Initially hide the extra letters */
    .expandable {
      opacity: 0;
      display: inline-block;
    }

    /* Animation for the L and D to move apart */
    @keyframes moveL {
      0%, 20% { transform: translateX(0); }
      80%, 100% { transform: translateX(-240px); }
    }
    
    @keyframes moveD {
      0%, 20% { transform: translateX(0); }
      80%, 100% { transform: translateX(265px); }
    }

    /* Animation for the expanding letters to fade in */
    @keyframes revealText {
      0%, 30% { opacity: 0; transform: translateY(5px); filter: blur(5px); }
      80%, 100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* Dot specific animation: fade out when expanding */
    @keyframes fadeDot {
      0%, 20% { opacity: 1; }
      40%, 100% { opacity: 0; }
    }

    .letter-L { animation: moveL 3.5s cubic-bezier(0.85, 0, 0.15, 1) forwards; }
    .letter-D { animation: moveD 3.5s cubic-bezier(0.85, 0, 0.15, 1) forwards; }
    .expand-text { animation: revealText 3.5s cubic-bezier(0.85, 0, 0.15, 1) forwards; }
    .dot { animation: fadeDot 3.5s cubic-bezier(0.85, 0, 0.15, 1) forwards; }

    /* Container reveal */
    @keyframes containerReveal {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }
    .logo-container { animation: containerReveal 1.5s ease-out forwards; }
    
    /* Glow pulse for premium feel */
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(245, 245, 242, 0.1)); }
      50% { filter: drop-shadow(0 0 25px rgba(245, 245, 242, 0.25)); }
    }
    .brand-text { animation: glow 4s ease-in-out infinite; }
  </style>
<g class="logo-container">
<!-- Centered initially at x=400, y=220 -->
<text class="brand-text" y="220">
<tspan class="letter-L" x="400">L</tspan>
<tspan class="dot">.</tspan>
<tspan class="letter-D" x="400">D</tspan>
</text>
<!-- Expanded text fragments -->
<text class="brand-text expand-text" y="220">
<tspan dy="0" font-size="80" x="260">ENARD</tspan>
<tspan dy="0" font-size="80" x="545">ESIGNS</tspan>
</text>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_26 -->
</body>
</html>
